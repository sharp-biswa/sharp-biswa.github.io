<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Biswaranjan Sahoo</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030303;
            --border: rgba(255,255,255,0.08);
            --text: #efefef;
            --text-secondary: #999;
            --accent: #2ee06e;
            --font-sans: 'Space Grotesk', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }
        .container {
            position: relative;
            max-width: 520px;
            width: 100%;
            background: rgba(12,12,12,0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .code {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 12px;
            display: inline-block;
            background: rgba(46,224,110,0.08);
            border: 1px solid rgba(46,224,110,0.25);
            padding: 4px 12px;
            border-radius: 20px;
        }
        h1 {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: -0.04em;
            margin-bottom: 8px;
            color: #fff;
        }
        p {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent);
            color: #000;
            font-weight: 600;
            font-size: 13px;
            padding: 12px 24px;
            border-radius: 30px;
            text-decoration: none;
            transition: all 0.2s ease;
            font-family: var(--font-mono);
        }
        .btn:hover {
            background: #45f080;
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">ERR_SYSTEM_404</div>
        <h1>404</h1>
        <p>The coordinate or asset you requested does not exist on this cluster or was relocated.</p>
        <a href="./" class="btn">
            <span>&larr;</span> Return to Home
        </a>
    </div>
</body>
</html>
